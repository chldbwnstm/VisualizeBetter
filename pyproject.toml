[project]
name = "visualizebetter"
version = "0.0.0"
description = "MCP-native realtime graph workspace for AI co-exploration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "lark>=1.1",
    "google-re2>=1.1",
]

[project.scripts]
visualizebetter = "visualizebetter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visualizebetter"]

[tool.pytest.ini_options]
testpaths = ["visualizebetter/tests"]
