<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VisualizeBetter</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #020617;
        color: #94a3b8;
        font: 14px system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin-right: 12px;
        border: 3px solid #1e293b;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Shown only until main.rs navigates the webview to the serve sidecar. -->
    <div class="spinner"></div>
    <span>Starting VisualizeBetter…</span>
  </body>
</html>
