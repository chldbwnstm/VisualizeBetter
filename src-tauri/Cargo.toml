[package]
name = "visualizebetter-desktop"
version = "0.1.0"
description = "VisualizeBetter — Tauri v2 desktop shell ([8-F], D11)"
authors = ["VisualizeBetter"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# The shell is a thin layer ([8-F]): it loads the same React SPA the web app uses
# and spawns `visualizebetter serve` as a PyInstaller sidecar. It owns no graph.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# [8-D] the serve sidecar is launched via the shell plugin's externalBin support.
tauri-plugin-shell = "2"
# Prevent two shells (each spawning a sidecar) from racing the same data dir.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled for release builds; `tauri dev` runs without it.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
